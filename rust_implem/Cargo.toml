[package]
name = "pq-rerand"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Post-quantum publicly re-randomizable encryption (BFV/LPR + CRT noise-limb trick). Constant-time by construction; not yet externally audited."
repository = "https://github.com/massalabs/pq-rerand"
keywords = ["post-quantum", "ring-lwe", "re-randomization", "encryption"]
categories = ["cryptography"]

[dependencies]
rand = "0.8"
rayon = "1.12"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
